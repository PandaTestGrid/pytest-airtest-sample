[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/report.json
markers =
    smoke: 冒烟测试
    regression: 回归测试
    ui: UI自动化测试
    android: Android平台测试
    ios: iOS平台测试
    performance: 性能测试
    stress: 压力测试
    cloud: 云平台专用测试
    local: 本地设备专用测试
    retry: 支持重试的测试